# =============================================================================
# CSM-SET — Public Docker Compose Configuration
# =============================================================================
#
# Purpose:
#   One-command zero-credential boot for public users.  No .env file, no
#   TradingView account, no market-data fetch required.  The API serves
#   pre-computed research artefacts from results/static/ (read-only).
#
# Usage:
#   docker compose up               # Start the public API on port 8100
#   docker compose up -d            # Detached mode
#   docker compose down             # Stop and remove the container
#
# Smoke test:
#   docker compose up -d --wait && \
#     curl -f http://localhost:8100/health && \
#     curl -f http://localhost:8100/api/v1/signals/latest && \
#     docker compose down
#
# Owner / private mode:
#   See docker-compose.private.yml for the override file that enables
#   data fetching, writes, and tvkit cookie-based authentication
#   (TVKIT_AUTH_TOKEN, set as a JSON cookie blob).
#   Invoke with:
#     docker compose -f docker-compose.yml -f docker-compose.private.yml up
#
# Environment variables (all optional — sensible defaults baked into image):
#   CSM_PUBLIC_MODE           true → read-only API, write endpoints return 403
#   CSM_LOG_LEVEL             INFO | DEBUG | WARNING | ERROR
#   CSM_CORS_ALLOW_ORIGINS    comma-separated origins; "*" for public mode
# =============================================================================

services:
  csm:
    build: .
    # PID-1 reaper (tini): uvicorn runs as PID 1 and does not wait() on
    # children, so SIGKILLed healthcheck `curl` processes pile up as <defunct>
    # zombies. `init: true` makes Docker inject tini as PID 1 to reap them.
    init: true
    ports:
      - "8100:8000"
    environment:
      CSM_PUBLIC_MODE: "true"
      CSM_LOG_LEVEL: "INFO"
      CSM_CORS_ALLOW_ORIGINS: "*"
      # Pin the OHLCV source. Since 2026-06-02 the code default is "db", which
      # *requires* CSM_MARKET_DATA_ENGINE_BASE_URL — unset here, so Settings()
      # raises at startup and the container never becomes healthy. That is why
      # this image has been undeployable since that commit and why docker-smoke
      # cannot start the service.
      #
      # "parquet" is the tvkit path, which is exactly what the live container has
      # been running all along, so this changes no behaviour — it only makes the
      # current code startable. Set on the BASE service on purpose: Settings() is
      # constructed in public mode too, so the validator fires in both modes.
      #
      # To move to the engine instead, set CSM_OHLCV_SOURCE=db together with
      # CSM_MARKET_DATA_ENGINE_BASE_URL=http://quant-marketdata-engine:8000 —
      # a deliberate data-source change, not a default to drift into.
      CSM_OHLCV_SOURCE: "parquet"
    volumes:
      - ./results:/app/results:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 2g
    restart: unless-stopped

networks:
  default:
    name: quant-network
    external: true
