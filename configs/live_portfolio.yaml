# CSM-SET Live Test — Canonical Portfolio State
# ==============================================
# Single source of truth for the live paper-trading positions.  Used by
# ``csm.live.portfolio.load_live_portfolio`` to compute the actual NAV
# during ``run_post_refresh_hook`` (db_gateway.daily_performance and
# db_gateway.portfolio_snapshot).
#
# Update on each rebalance day (last trading day of the month for ATO on the
# first trading day of the next month).  Between rebalances this file is
# immutable.
#
# Symbols may be written either bare (``DELTA``) or prefixed (``SET:DELTA``);
# the loader prepends ``SET:`` when missing to match the parquet column
# format.
#
# avg_cost convention
# -------------------
# ``avg_cost`` is the **commission-inclusive average cost per share**, stored
# at 4 decimals.  This matches the broker's internal precision and lets the
# daily-log per-symbol ``%U.PL`` reproduce the broker statement exactly:
#
#     %U.PL = (shares * close_price) / (shares * avg_cost) - 1
#
# Brokers in Thailand display ``avg_cost`` rounded to 2 decimals on screen but
# compute ``%U.PL`` against the unrounded value.  When recording a fresh
# rebalance, take ``avg_cost`` from the broker's executed-trade confirmation
# (price + commission + VAT, divided by shares) rather than the on-screen
# rounded display.  The loader's NAV / drawdown math does not read
# ``avg_cost`` (only ``shares`` and ``cash``), so this field exists solely to
# drive the daily-log %U.PL calculation.

